# In Dokploy: Create Service -> Compose -> diesen Inhalt einfügen.
# Das Image wird von GitHub Actions gebaut, der Server lädt es nur herunter.
services:
  app:
    image: ghcr.io/dizzle-code/julian-shop:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "5731:5731"
    environment:
      ADMIN_PIN: "bitte-aendern"
    volumes:
      - shop-data:/data

volumes:
  shop-data:
